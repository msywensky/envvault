# Packaging for macOS and Windows (the only supported platforms).
appId: com.envvault.app
productName: EnvVault
directories:
  buildResources: build

# Ship only the compiled app. electron-builder adds package.json and the
# production dependencies (libsodium, zod, zxcvbn-ts, @electron-toolkit/utils) itself.
files:
  - out/**/*
# The envvault command runs under plain Node, which can't read app.asar.
asarUnpack:
  - out/cli/**

# Fuses are flipped in the packaged binary: no run-as-node, no NODE_OPTIONS, no
# --inspect, and only app.asar is loaded (and integrity-checked).
# The envvault command runs under the user's own Node, not Electron's.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Left on (the default): the renderer loads over file://, and turning it off
  # leaves a blank window.
  grantFileProtocolExtraPrivileges: true
  # Flipping fuses rewrites Electron Framework and breaks its ad-hoc signature, and
  # electron-builder re-signs only with a signing identity. Without this the unsigned
  # build is killed at launch on Apple Silicon (Code Signature Invalid).
  resetAdHocDarwinSignature: true

# No native modules (libsodium is WebAssembly), so nothing to rebuild.
npmRebuild: false

# No auto-update: never generate app-update.yml or publish anything.
publish: null

win:
  executableName: envvault
  target: nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}

mac:
  target: dmg
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # macOS asks before an app reads ~/Documents, where projects folders often live.
    NSDocumentsFolderUsageDescription: EnvVault reads and writes the .env files in the projects folder you choose.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
