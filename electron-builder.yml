# Packaging for macOS and Windows (the only supported platforms).
appId: com.envvault.app
productName: EnvVault
directories:
  buildResources: build

# Ship only the compiled app. electron-builder adds package.json and the
# production dependencies (libsodium, zod, @electron-toolkit/utils) itself.
files:
  - out/**/*

# No native modules (libsodium is WebAssembly), so nothing to rebuild.
npmRebuild: false

# No auto-update: never generate app-update.yml or publish anything.
publish: null

win:
  executableName: envvault
  target: nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}

mac:
  target: dmg
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # macOS asks before an app reads ~/Documents, where projects folders often live.
    NSDocumentsFolderUsageDescription: EnvVault reads and writes the .env files in the projects folder you choose.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
