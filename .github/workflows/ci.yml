name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts skips our postinstall (Electron binary download, which
      # Electron 44 no longer lets ELECTRON_SKIP_BINARY_DOWNLOAD skip, and
      # electron-builder's native-deps step). Lint, tests and the build need
      # neither. The only dependencies with install scripts are
      # electron-winstaller (packaging) and the optional fsevents (watch mode).
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build # runs typecheck first
